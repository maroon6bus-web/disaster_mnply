<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="start-screen" class="screen active">
        <div class="start-container">
            <h1>Monopoly</h1>
            <p>プレイヤー人数を選択してください（残りはCPUになります）</p>
            <div class="player-select">
                <button class="select-btn" data-players="1">1人</button>
                <button class="select-btn" data-players="2">2人</button>
                <button class="select-btn" data-players="3">3人</button>
                <button class="select-btn" data-players="4">4人</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="game-container">
            <div class="board-wrapper" style="position: relative;">
                <div id="board">
                    <!-- Board spaces and tokens will be generated by JS -->
                </div>
                <div id="chart-container">
                    <canvas id="asset-chart"></canvas>
                    <div id="mini-charts-row">
                        <canvas id="land-chart"></canvas>
                        <canvas id="building-chart"></canvas>
                    </div>
                </div>
                <!-- 地価変動メッセージ表示用 -->
                <div id="center-message">
                    <h3>📈 地価変動発生！</h3>
                    <p id="center-message-text"></p>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="turn-info">
                    <h2 id="current-turn-display">Player 1 のターン</h2>
                </div>
                
                <div class="player-stats" id="player-stats">
                    <!-- Player info will be generated by JS -->
                </div>
                
                <div class="actions">
                    <div id="dice-container">
                        <div class="dice" id="dice1">1</div>
                        <div class="dice" id="dice2">1</div>
                    </div>
                    <button id="roll-btn" class="action-btn" disabled>サイコロを振る</button>
                    <button id="build-btn" class="action-btn" style="display: none; background-color: #eab308;">建物を建てる</button>
                    <button id="end-turn-btn" class="action-btn" style="display: none;">ターン終了</button>
                </div>
                
                <div class="log-panel">
                    <h3>メッセージログ</h3>
                    <div id="log-messages"></div>
                </div>
            </div>
        </div>
        
        <!-- Modal for buying property -->
        <div id="property-modal" class="modal">
            <div class="modal-content">
                <h2 id="modal-property-name">Property Name</h2>
                <p id="modal-property-price">価格: $0</p>
                <div class="modal-actions">
                    <button id="buy-btn" class="action-btn">購入する</button>
                    <button id="skip-btn" class="action-btn">見送る</button>
                </div>
            </div>
        </div>

        <!-- Modal for Building -->
        <div id="build-modal" class="modal">
            <div class="modal-content" style="max-width: 500px;">
                <h2>建物を建てる</h2>
                <p style="font-size: 1rem; color: #ccc;">独占している色の土地に家やホテルを建てられます。</p>
                <div id="build-list" style="margin: 1.5rem 0; max-height: 300px; overflow-y: auto; text-align: left;">
                    <!-- 建築可能な土地のリストがJSで生成されます -->
                </div>
                <div class="modal-actions">
                    <button id="close-build-btn" class="action-btn" style="background-color: #64748b;">閉じる</button>
                </div>
            </div>
        </div>

        <!-- Modal for Chance Card -->
        <div id="chance-card-modal" class="modal">
            <div class="chance-card">
                <div class="chance-header">CHANCE</div>
                <div class="chance-text" id="chance-card-text"></div>
                <div class="chance-timer">クリックでスキップ（15秒で自動進行）</div>
            </div>
        </div>

        <!-- Modal for Disaster Card -->
        <div id="disaster-modal" class="modal">
            <div class="disaster-card">
                <div class="disaster-header">DISASTER</div>
                <div class="disaster-icon">⚠️</div>
                <div class="disaster-type" id="disaster-type"></div>
                <div class="disaster-text" id="disaster-text"></div>
                <div class="disaster-timer">クリックでスキップ（15秒で自動進行）</div>
            </div>
        </div>

        <!-- Modal for Land Administration Card -->
        <div id="land-admin-modal" class="modal">
            <div class="land-admin-card">
                <div class="land-admin-header">土地行政</div>
                <div class="land-admin-type" id="land-admin-type"></div>
                <div class="land-admin-text" id="land-admin-text"></div>
                <div id="land-admin-interaction" class="land-admin-interaction">
                    <!-- Dynamic buttons/inputs will be added here -->
                </div>
                <div class="land-admin-timer" id="land-admin-timer">クリックでスキップ</div>
            </div>
        </div>
    </div>
    
        <!-- Modal for Game Results -->
        <div id="result-modal" class="modal">
            <div class="modal-content" style="max-width: 600px;">
                <h1>ゲーム終了</h1>
                <div id="result-list" style="margin: 2rem 0;">
                    <!-- Results will be generated by JS -->
                </div>
                <button onclick="location.reload()" class="action-btn">タイトルへ戻る</button>
            </div>
        </div>
    <!-- BGM Control -->
    <button id="bgm-toggle" class="bgm-btn" title="BGM Toggle">
        <span class="icon">🎵</span>
    </button>

    <script src="main.js"></script>
</body>
</html>
